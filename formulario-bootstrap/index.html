<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Inscrição / Contato</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>
      <div class="container">
         <h1>Inscrição / Contato</h1>
         <p>Preencha os campos abaixo. <br>Campos marcados com <b>*</b> são obrigatórios</p>
      </div>
   </header>
   <main>
      <form action="" method="post" enctype="multipart/form-data">
         <!--Cadastro de Dados Pessoais-->
         <section>
            <div class="container">

               <div class="row">
                  <div class="col-6">
                     <label for="firstName" class="form-label">Name <span class="required">*</span></label>
                     <input type="text" class="form-control" id="firstName" name="firstName" placeholder="João, Maria, Carlos..." required>
                  </div>
                  <div class="col-6">
                     <label for="surname" class="form-label">Surname <span class="required">*</span></label>
                     <input type="text" class="form-control" id="surname" name="surname" placeholder="Silva, Carvalho, Ribeiro..." required><br>
                  </div>
               </div>
               <div class="row">
                  <div class="col-6">
                     <label for="clientEmail" class="form-label">E-mail <span class="required">*</span></label>
                     <input type="email" class="form-control" id="clientEmail" name="clientEmail" placeholder="nome@exemplo.com" required>
                  </div>
                  <div class="col-6">
                     <label for="clientNumber" class="form-label">Phone Number</label>
                     <input type="tel" class="form-control" id="clientNumber" name="clientNumber" placeholder="(99) 9 9999-9999"><br>
                  </div>
               </div>
               <div class="row">
                  <div class="col-6">
                     <label for="clientCpf" class="form-label">CPF <span class="required">*</span></label>
                     <input type="text" class="form-control" id="clientCpf" name="clientCpf" placeholder="999.999.999-99" maxlength="14" required>
                  </div>
                  <div class="col-6">
                     <div class="mb-3">
                        <label for="clientBirthDate" class="form-label">Birth Date <span class="required">*</span></label>
                        <input type="date" class="form-control" id="clientBirthDate" name="clientBirthDate" required>
                     </div>
                  </div>
               </div>
               <div class="row">
                  <div class="col-6">
                     <label for="clientPassword" class="form-label">Password <span class="required">*</span></label>
                     <input type="password" id="clientPassword" name="clientPassword" class="form-control" placeholder="Mínimo: 6 caracteres" minlength="6" required>
                  </div>
                  <div class="col-6">
                     <label for="clientFunction" class="form-label">Função</label>
                     <select class="form-select" id="clientFunction" name="clientFunction">
                        <option value="" selected>Escolha uma função:</option>
                        <option value="Engenheiro">Engenharia</option>
                        <option value="Desenvolvedor">Desenvolvedor</option>
                        <option value="Analista">Analista</option>
                        <option value="DevOps">DevOps</option>
                     </select>
                  </div>
               </div><br>

               <label for="clientUsername"> User</label>
               <div class="input-group mb-3">
                  <span class="input-group-text">@</span>
                  <div class="form-floating">
                     <input type="text" class="form-control" id="clientUsername" name="clientUsername" placeholder="Username">
                     <label for="clientUsername">Username</label>
                  </div>
               </div>

               <div class="mb-3">
                  <label for="coments" class="form-label">Mensagem</label>
                  <textarea class="form-control" id="coments" name="coments" rows="3" placeholder="Escreva aqui..."></textarea>
               </div>

               <label for="clientResume">Envio de Currículo (PDF)</label>
               <div class="input-group">
                  <input type="file" class="form-control" id="clientResume" name="clientResume" accept="application/pdf" aria-describedby="clientResumeHelp">
               </div>
               <div id="clientResumeHelp" class="form-text">
                  Max. 5MB. Apenas PDF.
               </div>

            </div>
            <br>
         </section>

         <!--Seleção de Contato-->
         <section>
            <div class="container">
               <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" id="inlineCheckbox1" name="newsletter" value="sim">
                  <label class="form-check-label" for="inlineCheckbox1">Quero receber novidades!</label>
               </div>
               <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="contactMethod" id="inlineRadio1" value="email">
                  <label class="form-check-label" for="inlineRadio1">Contact by E-mail</label>
               </div>
               <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="contactMethod" id="inlineRadio2" value="telefone">
                  <label class="form-check-label" for="inlineRadio2">Contact by Number</label>
               </div>
               <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="contactMethod" id="inlineRadio3" value="ambos">
                  <label class="form-check-label" for="inlineRadio3">Both methods</label>
               </div>
               <div><br>
                  <button type="submit" class="btn btn-primary">
                     Enviar
                  </button>

                  <button type="reset" class="btn btn-outline-secondary">
                     Limpar
                  </button>
               </div>
               <br>
            </div>
         </section>
      </form>
   </main>

   <footer>

   </footer>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
